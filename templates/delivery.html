<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorbike Delivery - Somaliland Express</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="brand-icon"><i class="fas fa-bus"></i></div>
            <div class="brand-text">Somaliland <span>Express</span></div>
        </a>
        <div class="nav-right">
            <div class="user-info" id="userInfo" style="display:none">
                <i class="fas fa-user-circle"></i>
                <span id="userName"></span>
                <a href="/profile" class="btn-link"><i class="fas fa-home"></i> Profile</a>
                <button class="btn-link logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
            <div id="loginTrigger">
                <button class="btn btn-primary" onclick="openLoginModal()"><i class="fas fa-sign-in-alt"></i> Login</button>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <a href="/profile" class="back-link"><i class="fas fa-arrow-left"></i> Back to Profile</a>

            <div class="route-banner delivery-banner">
                <h2><i class="fas fa-motorcycle"></i> Motorbike Delivery</h2>
            </div>

            <div class="payment-container">
                <div class="booking-summary-card">
                    <h2><i class="fas fa-box"></i> Delivery Details</h2>
                    <form id="deliveryForm" onsubmit="submitDeliveryBooking(event)">
                        <div class="form-group">
                            <label><i class="fas fa-circle" style="color:var(--success);font-size:0.6rem"></i> Pickup Location</label>
                            <input type="text" id="deliveryPickup" placeholder="e.g. Hargeisa Central Market" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-map-pin" style="color:var(--danger)"></i> Drop-off Location</label>
                            <input type="text" id="deliveryDropoff" placeholder="e.g. Burao Main Street" required>
                        </div>

                        <h3 style="margin:20px 0 10px;color:var(--dark);font-size:1rem;"><i class="fas fa-user"></i> Recipient Info</h3>
                        <div class="form-group">
                            <label>Recipient Name</label>
                            <input type="text" id="recipientName" placeholder="Who will receive this?" required>
                        </div>
                        <div class="form-group">
                            <label>Recipient Phone</label>
                            <input type="tel" id="recipientPhone" placeholder="e.g. 61 9876543" required>
                        </div>

                        <h3 style="margin:20px 0 10px;color:var(--dark);font-size:1rem;"><i class="fas fa-box"></i> Package Info</h3>
                        <div class="form-group">
                            <label>Item Description</label>
                            <input type="text" id="itemDescription" placeholder="e.g. Documents, Phone, Clothes" required>
                        </div>
                        <div class="form-group">
                            <label>Item Value ($)</label>
                            <input type="number" id="itemValue" placeholder="Estimated value" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-clock"></i> Schedule (optional)</label>
                            <input type="datetime-local" id="deliverySchedule">
                        </div>

                        <div class="taxi-fare-display">
                            <span>Delivery Fee</span>
                            <strong id="deliveryFareDisplay">$3</strong>
                        </div>
                        <button type="submit" class="btn btn-success btn-block btn-lg" id="deliveryBookBtn">
                            <i class="fas fa-paper-plane"></i> Send Delivery
                        </button>
                    </form>
                </div>

                <div class="payment-method-card">
                    <h2><i class="fas fa-credit-card"></i> Payment Method</h2>
                    <div class="payment-options">
                        <label class="payment-option" onclick="selectDeliveryPayment('zaad')">
                            <input type="radio" name="deliveryPayment" value="zaad">
                            <div class="option-content zaad-option">
                                <div class="option-icon"><i class="fas fa-mobile-alt"></i></div>
                                <div class="option-info">
                                    <h4>Zaad</h4>
                                    <p>Telecom mobile money</p>
                                </div>
                                <div class="option-check"><i class="fas fa-check-circle"></i></div>
                            </div>
                        </label>
                        <label class="payment-option" onclick="selectDeliveryPayment('edahab')">
                            <input type="radio" name="deliveryPayment" value="edahab">
                            <div class="option-content edahab-option">
                                <div class="option-icon"><i class="fas fa-wallet"></i></div>
                                <div class="option-info">
                                    <h4>Edahab</h4>
                                    <p>Dahabshiil mobile money</p>
                                </div>
                                <div class="option-check"><i class="fas fa-check-circle"></i></div>
                            </div>
                        </label>
                        <label class="payment-option" onclick="selectDeliveryPayment('cash')">
                            <input type="radio" name="deliveryPayment" value="cash">
                            <div class="option-content cash-option">
                                <div class="option-icon"><i class="fas fa-money-bill-wave"></i></div>
                                <div class="option-info">
                                    <h4>Cash</h4>
                                    <p>Pay when delivered</p>
                                </div>
                                <div class="option-check"><i class="fas fa-check-circle"></i></div>
                            </div>
                        </label>
                    </div>
                    <div class="payment-ref-section" id="deliveryRefSection" style="display:none">
                        <div class="form-group">
                            <label>Payment Reference Number</label>
                            <input type="text" id="deliveryPaymentRef" placeholder="Enter transaction reference">
                        </div>
                        <p class="payment-note">After sending money, enter the reference number from your SMS confirmation.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeLoginModal()">&times;</button>
            <div class="modal-header">
                <div class="modal-icon"><i class="fas fa-motorcycle"></i></div>
                <h2>Login Required</h2>
                <p>Login to send a delivery</p>
            </div>
            <form id="loginForm" onsubmit="doLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="loginName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label><i class="fab fa-whatsapp"></i> WhatsApp Number</label>
                    <input type="tel" id="loginWhatsApp" placeholder="e.g. 61 1234567" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login / Register
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>checkLogin();</script>
</body>
</html>
